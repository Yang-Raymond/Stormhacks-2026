services:
  db:
    image: timescale/timescaledb:latest-pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: debugcode
    ports:
      - "127.0.0.1:5432:5432" # local only; nothing outside this machine should reach the database
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d debugcode"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Executes untrusted user code: no internet, read-only FS, no capabilities, capped resources.
  runner:
    build: ./runner
    networks: [sandbox]
    read_only: true
    tmpfs:
      # Compilers write object files and binaries here, and C/C++ binaries run from it (hence exec).
      - /tmp:size=256m,exec
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # JVM, Mono and the C++ compiler need more headroom than Python did.
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 256
    restart: unless-stopped

  server:
    build: ./server
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:${POSTGRES_PASSWORD}@db:5432/debugcode}
      RUNNER_URL: http://runner:8000
    ports:
      - "127.0.0.1:4000:4000" # local only: public traffic must go through the front end / reverse proxy
    volumes:
      - ./server:/app
      - /app/node_modules
    networks: [default, sandbox]
    depends_on:
      db:
        condition: service_healthy
      runner:
        condition: service_started

  front_end:
    build: ./front_end
    environment:
      API_URL: http://server:4000
    ports:
      - "3000:3000"
    volumes:
      - ./front_end:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - server

networks:
  sandbox:
    internal: true

volumes:
  db-data:
